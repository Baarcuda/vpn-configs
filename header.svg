<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 70" width="100%" height="70">
  <defs>
    <linearGradient id="greenPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981">
        <animate attributeName="stop-color" values="#10b981;#34d399;#059669;#10b981" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#34d399">
        <animate attributeName="stop-color" values="#34d399;#059669;#10b981;#34d399" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#059669">
        <animate attributeName="stop-color" values="#059669;#10b981;#34d399;#059669" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <filter id="sparkGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title-vpn { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 900; font-size: 40px; fill: url(#greenPulse); letter-spacing: -0.5px; }
      .title-black { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 900; font-size: 40px; fill: #050505; letter-spacing: -0.5px; }
      @media (prefers-color-scheme: dark) { .title-black { fill: #09090b; stroke: #3f3f46; stroke-width: 0.8px; } }
    </style>
  </defs>
  <text x="10" y="48">
    <tspan class="title-vpn">VPN Configs</tspan>
    <tspan dx="16" class="title-black">Black Lists</tspan>
  </text>
  <circle r="3.2" fill="#ff7a00" filter="url(#sparkGlow)" opacity="0.92">
    <animateMotion path="M 12 18 L 265 18 A 12 12 0 0 1 265 54 L 12 54 A 12 12 0 0 1 12 18 Z" dur="7.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.65;1;0.75;0.95;0.65" dur="3s" repeatCount="indefinite" />
  </circle>
</svg>
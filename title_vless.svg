<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 48" width="100%" height="48">
  <defs>
    <linearGradient id="bluePulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7">
        <animate attributeName="stop-color" values="#0284c7;#38bdf8;#1d4ed8;#0284c7" dur="4.5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#2563eb">
        <animate attributeName="stop-color" values="#2563eb;#0284c7;#38bdf8;#2563eb" dur="4.5s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <filter id="blueGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#0284c7" flood-opacity="0.55">
        <animate attributeName="flood-opacity" values="0.35;0.75;0.35" dur="4.5s" repeatCount="indefinite" />
      </feDropShadow>
    </filter>
  </defs>
  <text x="4" y="34" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="800" font-size="28" fill="url(#bluePulse)" filter="url(#blueGlow)">
    ⚡ Top 100 Fastest VLESS (Global)
  </text>
</svg>
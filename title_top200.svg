<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 48" width="100%" height="48">
  <defs>
    <linearGradient id="orangePulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b00">
        <animate attributeName="stop-color" values="#ff6b00;#ffa333;#ea580c;#ff6b00" dur="4.5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ea580c">
        <animate attributeName="stop-color" values="#ea580c;#ff6b00;#ffa333;#ea580c" dur="4.5s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <filter id="orangeGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ff7a00" flood-opacity="0.55">
        <animate attributeName="flood-opacity" values="0.35;0.75;0.35" dur="4.5s" repeatCount="indefinite" />
      </feDropShadow>
    </filter>
  </defs>
  <text x="4" y="34" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="800" font-size="28" fill="url(#orangePulse)" filter="url(#orangeGlow)">
    ⚡ Top 200 Fastest Configs (Global)
  </text>
</svg>